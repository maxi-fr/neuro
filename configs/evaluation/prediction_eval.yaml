# Short-horizon prediction analysis (notebooks/sysid_prediction_comparison.py).
#
# Evaluates ONE model at a time (`model:` below) -- the JAX reduced model or the
# Equinox NN predictor -- at predicting EEG over 200 ms / 400 ms horizons on held-out
# seeds of the seizure + PRBS-tES regime, vs ground truth and a persistence baseline.
# The model is conditioned on a 400 ms window of MEASURED EEG only, then runs open-loop with
# the recorded controls. Metrics are scale-invariant (NRMSE, correlation, FC).

# --- Data split (held-out test/ seeds vs the train/ seeds used by the trainers) ---
data_dt: 1.0e-4        # native sampling step of the recordings (s)
test_sims:
  - results/simulation_2026-06-23_18-49-20/test/sim_090.npz
  - results/simulation_2026-06-23_18-49-20/test/sim_091.npz
  - results/simulation_2026-06-23_18-49-20/test/sim_092.npz
train_sims_glob: results/simulation_2026-06-23_18-49-20/train/*.npz  # for the disjointness check

# --- Pretrained artifacts (produced by the train-split runs of the two scripts) ---
artifacts:
  jax_sysid: results/sysid_jax_result.npz
  nn: artifacts\nn_predictor_2026-06-25_22-55-54\model.eqx

# --- tES projection for the physics models (matches jansen_rit_seizure_excited.yaml) ---
target_electrode: [CP5, T7]
gamma_spread: 20.0

# --- Evaluation protocol ---
horizons_ms: [200, 400]
context_ms: 400          # measured-EEG window each method warms up / conditions on
analysis_dt: 1.0e-2      # common grid for cross-method comparison (= NN step)
channels: null           # null -> all 62 EEG channels
n_windows: 20            # random test start points per recording set
seed: 69
model: jax_sysid         # the single model to evaluate (one at a time); options are the artifacts keys

# --- Display defaults (interactive UI seeds; also used in script mode) ---
plot_channels: [0, 15, 30, 45]   # channel indices shown in the trace panel
plot_horizon_ms: 400             # horizon used for the FC / PSD panels
trace_interval_ms: [0, 400]      # lead-time window shown in the trace panel

out_dir: results/prediction_eval
