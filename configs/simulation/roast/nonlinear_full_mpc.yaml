# Closed-loop seizure suppression on the roast_3d plant: full 62-channel EEG + Nonlinear MPC.
# MPCController solves an IPOPT NLP over a depth-1 softplus NN predictor identified on
# data/experiment_excited_roast, with no PCA -- the optimisation runs directly in EEG space.
# shooting_depth >= horizon is single shooting, which is what keeps this tractable.
t_end: 20.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  initial_state: rest
  connectome:
    speed: 50.0
    K: 0.60
  stimulation:
    model: roast_3d
    leadfield_path: data/roast_leadfield_3d.npz
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.eeg.EEGMeasurement
    # Full EEG: no selected_channels -> all 62 channels (matches the nonlinear_full predictor).

# Causal anti-alias low-pass at the controller's Nyquist -- the identical filter the predictor's
# training data was decimated with, so the loop feeds the model the signal it was fit on.
estimator: {class_path: neuro.filtering.AntiAliasEstimator, dt: 0.0001, downsample: 100}

controller:
  class_path: neuro.control.MPCController
  dt: 0.01
  artifact: artifacts/roast/nonlinear_full_lowpass/model   # trained WITH the estimator's filter
  horizon: 20
  u_max: 2.0
  w_y: 1.0
  w_u: 10.0
  shooting_depth: 20    # >= horizon -> single shooting (states condensed out; controls-only NLP)
  max_iter: 100
