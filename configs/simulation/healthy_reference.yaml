# Healthy reference runs for building the spectral MPC healthy-envelope cost.
# Matched twin of mse02_psd_mpc.yaml:
#   - uniform A = 3.25 (A_HEALTHY) across all 76 regions;
#   - stimulation off (ZeroController);
#   - identical connectome / K / sigma / field projection / sensors / estimator.
# 10 seeds x 60 s via the experiments: batch form.
experiments:
  - t_end: 60.0
    dynamics:
      class_path: neuro.jansen_rit.JansenRitDynamics
      regime: healthy
      seed: 69
      log: lfp
      stimulation:
        model: roast_3d
        field_projection_path: data/roast_field_projection_3d.npz
        electrodes: [TP9, CP5, Ex8]
    sensors: eeg
    estimator: {class_path: neuro.filtering.AntiAliasEstimator, dt: 0.0001, downsample: 200}
    controller:
      class_path: neuro.control.zero.ZeroController
      dt: 0.02
      n_u: 3
  - dynamics: {seed: 70}
  - dynamics: {seed: 71}
  - dynamics: {seed: 72}
  - dynamics: {seed: 73}
  - dynamics: {seed: 74}
  - dynamics: {seed: 75}
  - dynamics: {seed: 76}
  - dynamics: {seed: 77}
  - dynamics: {seed: 78}
