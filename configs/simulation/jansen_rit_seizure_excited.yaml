# Whole-brain Jansen-Rit seizure plant driven by a persistently-exciting tES waveform, for
# input->output (plant) identification. The ScheduleController plays back a precomputed
# per-electrode current (ras).
#
# t_end is 8 s so the set spends its samples on the seizure transition rather than on saturated
# dynamics. The trajectories themselves are downsample-independent -- they are logged at the full
# 1e-4 rate and decimated at load time -- so one set serves every training downsample. The single
# coupling is hold_ms: each hold must be an integer multiple of dt_mpc = downsample * 1e-4, or a
# block boundary lands mid-step and the strided u records a command the plant only partly held.
# Every hold below is a multiple of 10 ms, so this grid is aligned for downsample 100 and nothing
# coarser: at 200 the 10 ms hold is half a step, and at 400 the 10 and 100 ms holds are fractional.
t_end: 8.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 70
  initial_state: rest
  connectome:
    speed: 50.0
    K: 0.60
  stimulation:
    model: roast_3d
    field_projection_path: data/roast_field_projection_3d.npz
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.eeg.EEGMeasurement

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.schedule.ScheduleController
  dt: 0.0001
  n_u: 3              # one per stimulation electrode (TP9, CP5 cathodes + EX8 return)
  input_type: ras
  amp: 3.0
  hold_ms: [10.0, 100.0, 200.0, 400., 1000.0]
  duration: 8.0
  input_seed: 109
