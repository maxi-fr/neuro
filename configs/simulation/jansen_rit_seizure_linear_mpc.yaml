# Closed-loop seizure suppression with a *linear* MPC: the whole-brain Jansen-Rit seizure
# plant driven by LinearMPCController, which embeds a linear (0-hidden-layer) CasADi NN
# predictor as its dynamics model. Since the predictor is an exact affine map, suppressing
# predicted EEG power over `horizon` steps under per-electrode amplitude bounds is a convex QP.
#
# `controller.formulation` picks the QP formulation: `sparse` stacks the intermediate states as
# decision variables and solves with OSQP; `dense` condenses them out and solves with qpOASES.
# Both solve the same problem; `sparse` scales better to long horizons, `dense` to small
# `horizon * n_elec`.
#
# The controller runs at the predictor's native step (dt: 0.01 = plant dt 1e-4 x downsample
# 100); the orchestrator's zero-order hold applies each control across 100 plant steps.
# `controller.artifact` must point at a trained *linear* NN predictor artifact (the basename of
# the .eqx/.json/.scalers.npz triple from scripts/run_nn_predictor_jax.py) -- train one with
# `model.depth: 0` in configs/nn_predictor/nn_predictor_config.yaml, n_controls=2 (electrodes
# CP5, T7) and EEG channels matching the sensor.
t_end: 5.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  speed: 50.0
  target_electrode: [CP5, T7]
  gamma_spread: 20.0
  params:
    K: 0.5357
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement: {class_path: neuro.measurement.EEGMeasurement, speed: 50.0}

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.LinearMPCController
  dt: 0.01
  artifact: artifacts/nn_predictor/model   # basename of the trained linear (depth 0) artifact
  horizon: 20
  u_max: 3.0
  w_y: 1.0
  w_u: 0.0
  formulation: sparse   # `sparse` -> OSQP (stacked) ; `dense` -> qpOASES (condensed)
  osqp_eps: 1.0e-9      # OSQP abs/rel tolerance (sparse formulation only)
