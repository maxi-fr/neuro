# Closed-loop seizure suppression, setup 3/6: FULL 62-channel EEG + Nonlinear NARX MPC.
# NarxMPCController solves an output-lifted NLP (IPOPT) using a depth-1 (nonlinear) NN
# predictor. Consumes the nonlinear_full artifact (mpc_nonlinear_full.yaml). Controller runs
# at the predictor native step dt: 0.01 = plant dt 1e-4 x downsample 100.
t_end: 20.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  initial_state: rest
  connectome:
    speed: 50.0
    K: 0.60
  stimulation:
    model: analytical
    electrodes: [TP9, CP5, EX8]
    spread: 15.0
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.measurement.EEGMeasurement
    speed: 50.0
    # Full EEG: no selected_channels -> all 62 channels (matches the nonlinear_full predictor).

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.NarxMPCController
  dt: 0.01
  artifact: artifacts/meeting_seven_experiment/nonlinear_full/model   # depth-1 (nonlinear) artifact basename
  horizon: 20
  u_max: 3.0
  w_y: 1.0
  w_u: 10.0
  max_iter: 100        # IPOPT iteration cap per solve (capped iterate is still applied)
  max_cpu_time: null   # per-solve wall-time budget (s); null = unbounded
  expand: false        # MX->SX expansion; off -- the unrolled MLP graph is faster as MX
