# Closed-loop seizure suppression, setup 5/6: SELECTED 25-channel EEG + Nonlinear MPC.
# MPCController solves a multiple-shooting NLP (IPOPT) using a depth-1 (nonlinear) NN predictor
# trained on the manually-selected 25-channel montage, PCA-decorrelated to 20 latents (raw channels
# leave the tES->EEG response under-identified for the MLP -- see knowledge-base note, sec. 9).
# Consumes the nonlinear_selected artifact. Controller runs at the predictor native step
# dt: 0.01 = plant dt 1e-4 x downsample 100.
t_end: 5.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  connectome:
    speed: 50.0
    target_electrode: [CP5, T7]
    gamma_spread: 20.0
    K: 0.5357
  params:
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.measurement.EEGMeasurement
    speed: 50.0
    # Must match the montage the predictor was trained on (see jansen_rit_seizure_excited.yaml).
    selected_channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P7, P3, Pz, P4, P8, O1, O2, TP9, TP7, CP5, FC5, P5, PO7]

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.MPCController
  dt: 0.01
  artifact: artifacts/meeting_seven_experiment/nonlinear_selected/model   # depth-1 (nonlinear) artifact basename
  horizon: 20
  shooting_depth: 20   # >= horizon -> single shooting (states condensed out; controls-only NLP)
  u_max: 3.0
  w_y: 1.0
  w_u: 10.0
  max_iter: 100        # IPOPT iteration cap per solve (capped iterate is still applied)
  max_cpu_time: null   # per-solve wall-time budget (s); null = unbounded
  expand: false        # MX->SX expansion; off -- the unrolled MLP graph is faster as MX
