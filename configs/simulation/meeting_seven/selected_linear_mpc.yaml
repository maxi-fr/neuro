# Closed-loop seizure suppression, setup 6/6: SELECTED 25-channel EEG + Linear MPC.
# LinearMPCController solves a convex QP using a depth-0 (affine) NN predictor trained on the
# manually-selected 25-channel montage. Consumes the linear_selected artifact
# (mpc_linear_selected.yaml). Controller runs at the predictor native step dt: 0.01 = plant
# dt 1e-4 x downsample 100.
t_end: 20.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  initial_state: rest
  connectome:
    speed: 50.0
    K: 0.60
  stimulation:
    model: analytical
    electrodes: [TP9, CP5, EX8]
    spread: 15.0
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.measurement.EEGMeasurement
    speed: 50.0
    # Must match the montage the predictor was trained on (see jansen_rit_seizure_excited.yaml).
    selected_channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P7, P3, Pz, P4, P8, O1, O2, TP9, TP7, CP5, FC5, P5, PO7]

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.LinearMPCController
  dt: 0.01
  artifact: artifacts/meeting_seven_experiment/linear_selected/model   # depth-0 (linear) artifact basename
  horizon: 20
  u_max: 3.0
  w_y: 1.0
  w_u: 10.0
  formulation: dense    # `sparse` -> OSQP (stacked) ; `dense` -> qpOASES (condensed)
  osqp_eps: 1.0e-9      # OSQP abs/rel tolerance (sparse formulation only; ignored for dense)
