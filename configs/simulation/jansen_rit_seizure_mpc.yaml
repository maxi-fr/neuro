# Closed-loop seizure suppression: the whole-brain Jansen-Rit seizure plant driven by an
# MPC controller that embeds the CasADi NN predictor (NNSymbolicModel) as its dynamics
# model. The MPC minimizes predicted EEG power over `horizon` steps under per-electrode
# amplitude bounds and applies the first control (receding horizon).
#
# The controller runs at the predictor's native step (dt: 0.01 = plant dt 1e-4 x
# downsample 100); the orchestrator's zero-order hold applies each control across 100
# plant steps. `controller.artifact` must point at a trained NN predictor artifact (the
# basename of the .eqx/.json/.scalers.npz triple from scripts/run_nn_predictor_jax.py),
# trained with n_controls=2 (electrodes CP5, T7) and EEG channels matching the sensor.
t_end: 5.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  speed: 50.0
  target_electrode: [CP5, T7]
  gamma_spread: 20.0
  params:
    K: 0.5357
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement: {class_path: neuro.measurement.EEGMeasurement, speed: 50.0}

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.MPCController
  dt: 0.01
  artifact: artifacts/nn_predictor/model   # basename of the trained .eqx/.json/.scalers.npz triple
  horizon: 20
  u_max: 3.0
  w_y: 1.0
  w_u: 0.0
  max_iter: 100        # IPOPT iteration cap per solve (capped iterate is still applied)
  max_cpu_time: null   # per-solve wall-time budget (s); null = unbounded
  expand: false        # MX->SX expansion; off -- the unrolled MLP graph is faster as MX
