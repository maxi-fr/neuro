# L1-loss test, BEFORE (w_u_l1 = 0): dense-control baseline.
# Copy of meeting_seven/selected_linear_mpc.yaml, repointed at the existing post-Kirchhoff linear
# predictor (25-channel montage, 3 controls). w_u is set to 0 so the ONLY effort penalty in the
# `after` run is the L1 term -- this run is the no-L1, no-quadratic-effort reference.
t_end: 5.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  connectome:
    speed: 50.0
    target_electrode: [CP5, T7, F9]
    gamma_spread: 20.0
    K: 0.5357
  params:
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.measurement.EEGMeasurement
    speed: 50.0

estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}

controller:
  class_path: neuro.control.LinearMPCController
  dt: 0.01
  artifact: artifacts/nn_predictor_2026-07-27_18-19-15/model   # depth-0 (linear) artifact basename
  horizon: 20
  u_max: 3.0
  w_y: 1.0
  w_u: 0.0
  w_u_l1: 0.0           # BEFORE: no L1 sparsity penalty
  formulation: dense    # `sparse` -> OSQP (stacked) ; `dense` -> qpOASES (condensed)
  osqp_eps: 1.0e-9      # OSQP abs/rel tolerance (sparse formulation only; ignored for dense)
