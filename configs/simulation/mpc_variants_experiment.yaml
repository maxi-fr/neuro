experiments:
# =============================================================================
# FULL EEG MODEL (62 Channels)
# =============================================================================

# 1. Full EEG, Linear MPC (Base Configuration)
- t_end: 5.0
  dynamics:
    class_path: neuro.jansen_rit.JansenRitDynamics
    dt: 0.0001
    seed: 69
    connectome:
      speed: 50.0
      target_electrode: [CP5, T7]
      gamma_spread: 20.0
      K: 0.5357
    params:
      A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
        3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
        3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
        3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
        3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
        3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]
  reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}
  sensors:
    class_path: simulate.sensor.GaussianSensor
    dt: 0.0001
    std_dev: 0.0
    measurement:
      class_path: neuro.measurement.EEGMeasurement
      speed: 50.0
      # NO selected_channels specified here -> uses full 62 channels
  estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}
  controller:
    class_path: neuro.control.LinearMPCController
    dt: 0.01
    artifact: artifacts/nn_predictor/model_full_eeg_linear
    horizon: 20
    u_max: 3.0
    w_y: 1.0
    w_u: 0.0
    formulation: sparse
    osqp_eps: 1.0e-9

# 2. Full EEG, Linear NARX MPC
- controller:
    class_path: neuro.control.LinearMPCController
    artifact: artifacts/nn_predictor/model_full_eeg_linear_narx
    formulation: sparse
    osqp_eps: 1.0e-9

# 3. Full EEG, Nonlinear NARX MPC
- controller:
    class_path: neuro.control.MPCController
    artifact: artifacts/nn_predictor/model_full_eeg_nonlinear_narx
    max_iter: 100
    max_cpu_time: null
    formulation: sparse
    expand: false

# 4. Full EEG, PCA reduced nonlinear MPC
- controller:
    class_path: neuro.control.MPCController
    artifact: artifacts/nn_predictor/model_full_eeg_pca_nonlinear
    max_iter: 100
    max_cpu_time: null
    formulation: sparse
    expand: false


# =============================================================================
# SELECTED CHANNEL EEG (25 Channels)
# =============================================================================

# 5. Selected channel EEG, Nonlinear MPC
- sensors:
    measurement:
      selected_channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P7, P3, Pz, P4, P8, O1, O2, TP9, TP7, CP5, FC5, P5, PO7]
  controller:
    class_path: neuro.control.MPCController
    artifact: artifacts/nn_predictor/model_selected_eeg_nonlinear
    max_iter: 100
    max_cpu_time: null
    formulation: sparse
    expand: false

# 6. Selected channel EEG, Linear MPC
- sensors:
    measurement:
      selected_channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P7, P3, Pz, P4, P8, O1, O2, TP9, TP7, CP5, FC5, P5, PO7]
  controller:
    class_path: neuro.control.LinearMPCController
    artifact: artifacts/nn_predictor/model_selected_eeg_linear
    formulation: sparse
    osqp_eps: 1.0e-9
