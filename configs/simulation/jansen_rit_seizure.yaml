# Open-loop EZ/PZ seizure that *propagates* instead of starting everywhere at once: the focus
# ignites within a second, the PZ follows after ~3 s, and the left hemisphere is recruited over
# roughly 10 s while the right hemisphere stays healthy. The three settings behind that -- shared
# by every config in this directory, see docs/seizure_spread_tuning.md for the search -- are
#
#   connectome.K   0.60      coupling just below the point (~0.61) where the network seizes
#                            bilaterally on coupling alone; 0.5357 recruited both hemispheres
#   params.sigma   280.0     the noise-driven escape is what makes recruitment take seconds;
#                            the JansenRitParams default of 500 recruits within one second
#   initial_state  rest      the all-zero default costs an ictal-amplitude settling transient
#                            that ignites the whole network at t = 0
#
# Recruitment is a noise-driven escape, so the schedule is a random variable: across seeds the
# left hemisphere reaches half its extent anywhere between 1 s and 16 s (median ~6 s), and
# roughly one seed in ten never leaves the EZ. Seed 55 is pinned because it realises the target
# schedule almost exactly -- EZ at 0.5 s, PZ at 5.2 s, half the left hemisphere at 9.8 s, 92 %
# of the left hemisphere and none of the right -- so this config demonstrates the intended
# propagation rather than a fast draw from the same distribution.
t_end: 50.0
dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 55
  initial_state: rest
  connectome:
    speed: 50.0
    K: 0.60
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]
reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}
sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement: {class_path: neuro.measurement.EEGMeasurement, speed: 50.0}
estimator: {class_path: simulate.estimator.IdentityEstimator, dt: 0.0001}
controller: {class_path: neuro.control.ZeroController, dt: 0.0001, n_u: 1}
