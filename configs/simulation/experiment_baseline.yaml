- t_end: 20.0
  dynamics:
    class_path: neuro.jansen_rit.JansenRitDynamics
    dt: 0.0001
    seed: 1023
    initial_state: rest
    connectome:
      speed: 50.0
      K: 0.60
    stimulation:
