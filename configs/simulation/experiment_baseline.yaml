  reference:
    class_path: simulate.reference.StepReference
    dt: 0.0001
    step_value: 0.0
  sensors:
    class_path: simulate.sensor.GaussianSensor
    dt: 0.0001
    std_dev: 0.0
    measurement:
      class_path: neuro.measurement.EEGMeasurement
      speed: 50.0
  estimator:
    class_path: simulate.estimator.IdentityEstimator
    dt: 0.0001
  controller:
    class_path: neuro.control.WaveformController
    dt: 0.0001
    n_u: 3
    input_type: ras
    amp: 0.0    # paired baseline: no stimulation
    # Mixed block lengths (10 ms = one predictor step, plus 50/200 ms so the low-frequency band
    # the MPC actually commands in is excited) -- see base config & docs/tes_field_geometry.md sec. 9.8
    hold_ms: [10.0, 50.0, 200.0]
    transient_ms: 1000.0
    duration: 20.0
    input_seed: 101023
