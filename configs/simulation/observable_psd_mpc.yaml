# Closed-loop seizure suppression with the observable-space predictor and the same spectral cost.
# Matched pair with mse02_psd_mpc_spectral.yaml -- the ONLY difference is the artifact and the
# absence of w_y: the forecast has no per-sample state, so w_y is rejected rather than ignored.
# See docs/observable_prediction/spec.md.
t_end: 20.0

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  seed: 69
  initial_state: rest
  log: lfp              # region LFP, so seizure suppression is scorable after the run
  connectome:
    speed: 50.0
    K: 0.60
  stimulation:
    model: roast_3d
    field_projection_path: data/roast_field_projection_3d.npz
  params:
    sigma: 280.0
    A: [3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.6, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.25, 3.6, 3.25, 3.25,
      3.25, 3.25, 3.25, 3.25, 3.4, 3.25, 3.25, 3.4, 3.25, 3.25, 3.25]

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.eeg.EEGMeasurement
    # Full EEG: no selected_channels -> all 62 channels.

# Causal anti-alias low-pass at the controller's Nyquist -- the identical filter the predictor's
# training data was decimated with, so the loop feeds the model the signal it was fit on.
# downsample MUST equal the predictor config's simulation.downsample.
estimator: {class_path: neuro.filtering.AntiAliasEstimator, dt: 0.0001, downsample: 200}

controller:
  class_path: neuro.control.mpc.TrajOptMPCController
  dt: 0.02              # = predictor dt = 0.0001 * 200
  problem:
    class_path: neuro.control.mpc.build_observable_problem
    artifact: artifacts/observable_stft/model
    horizon: 75         # 1.5 s horizon (M=2 frames of L=50, R=25)
    u_max: 2.0
    w_y: 0.0
    w_u: 10.0
    w_psd: 1000.0
    psd_ref: data/healthy_psd.npz
    kirchhoff: true
