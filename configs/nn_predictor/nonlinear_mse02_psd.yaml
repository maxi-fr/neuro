simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_roast/train"

model:
  n_y: 15
  n_u: 10
  hidden_size: 128
  depth: 2
  activation: softplus

training:
  epochs: 300
  warmup_epochs: 10
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  seed: 69
  patience: 100
  scaler: "robust"
  global_scaling: true
  eval_horizon_s: 1.0
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 20
      curr_end: 80
    stft:
      weight: 1.0       # near-zero when the spectrum matches, ~10^2 when the rollout drifts
      n_span: 50        # 1.0 s at fs = 50 Hz
      n_segment: 50     # one frame per rollout: the Welch endpoint, scored per sample
      n_hop: 50         # n_segment 25 / n_hop 12 separates spectra better but controls worse:
                        # docs/spectrogram_loss_guide.md section 8.5
      start_epoch: 80   # the rollout must survive 1 s before its spectrum is scored

artifact: "artifacts/nonlinear_mse02_psd"
