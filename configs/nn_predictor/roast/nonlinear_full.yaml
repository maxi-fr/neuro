# Nonlinear (depth 1) NARX predictor on the full 62-channel EEG, no PCA, identified on the
# roast_3d plant. Serves the nonlinear MPC setup (MPCController, single shooting).
simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null          
  data_path: "data/experiment_excited_roast/train"   # full 62-channel EEG, roast_3d plant

model:
  n_y: 15
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 1               # nonlinear
  latent_dim: null       # no PCA -- full 62-channel state
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  curriculum_start_epoch: 50
  curriculum_end_epoch: 200
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 100
  scaler: "robust"
  global_scaling: true

artifact: "artifacts/roast/nonlinear_full"
