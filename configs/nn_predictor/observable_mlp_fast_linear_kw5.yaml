# Champion Observable MLP Predictor: Fast STFT, Linear Kernel width 5
# Selected in canonical_predictors_comparison campaign: mean seizure burden 0.057, delivered charge 6.76 uC.
simulation:
  fs: 50.0
  n_steps: null
  data_path: "data/experiment_excited_60ms/train"

model:
  n_y: 1
  n_u: 17
  hidden_size: 768
  depth: 1
  activation: tanh
  residual: true

observable:
  n_segment: 25           # 0.50 s Segment
  n_hop: 3                # 0.06 s Frame spacing
  band_hz: [1.0, 25.0]
  n_bin_pool: 1
  kernel: linear
  kernel_width: 5

training:
  fit: gradient_descent
  train_split: 0.8
  eval_horizon_s: 1.5
  epochs: 150
  batch_size: 256
  learning_rate: 0.000215
  weight_decay: 0.000063
  patience: 35
  scaler: standard
  device: auto
  seed: 69
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.5
      curr_start: 10
      curr_end: 80

artifact: "artifacts/canonical_predictors_comparison/1_observable_mlp/models/fast_linear_kw5"
