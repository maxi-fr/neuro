# Optuna sweep over Hankel-DMDc hyperparameters for the Observable predictor, at n_hop=15
# (dt_frame=0.3s, 1.5x the production decision rate). See sweep_dmd_observable_hop25.yaml for why
# the hop is varied across sibling files rather than inside one sweep.
simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  n_y: 1
  n_u: 4  # StftGeometry(n_segment=50, n_hop=15, kernel_width=1).min_past_controls()
  depth: 0

observable:
  n_segment: 50
  n_hop: 15
  band_hz: null
  n_bin_pool: 1
  kernel: boxcar
  kernel_width: 1

training:
  fit: dmd
  train_split: 0.8
  eval_horizon_s: 2.0
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 2.0
      curr_start: 0
      curr_end: 1

sweep:
  artifact: "artifacts/sweep_dmd_observable_hop15"
  n_trials: 30
  objective: val_log_mse
  model: {}
  training:
    dmd_energy:
      type: float
      low: 0.90
      high: 0.999
    dmd_lambda:
      type: loguniform
      low: 0.000001
      high: 0.1
