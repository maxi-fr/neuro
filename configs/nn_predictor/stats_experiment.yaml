simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"

model:
  n_y: 15
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 1
  latent_dim: null       # PCA latent components k; null or >= 62 (n EEG channels) disables it
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  curriculum_start_epoch: 50
  curriculum_end_epoch: 200
  seed: 69
  w_psd: 0.1             # batch-level Welch PSD loss (normalised, so weight ~ relative strength)
  w_fc: 0.1              # batch-level FC loss (normalised, so weight ~ relative strength)
  patience: 100
  scaler: "robust"
  global_scaling: true
