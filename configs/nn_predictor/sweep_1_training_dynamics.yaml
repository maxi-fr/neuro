simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  activation: softplus
  n_y: 15
  n_u: 10
  hidden_size: 128
  depth: 2
  residual: true

training:
  epochs: 250
  train_split: 0.8
  seed: 1903
  patience: 50
  scaler: "robust"
  global_scaling: true
  batch_size: 256
  eval_horizon_s: 0.2
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 100
      curr_end: 200
    eeg_ms:
      weight: 1.0
      span_s: 1.5

sweep:
  artifact: "artifacts/sweep_1_training_dynamics"
  n_trials: 10
  objective: val_loss
  model: {}
  training:
    learning_rate:
      type: loguniform
      low: 0.000005
      high: 0.0001
    weight_decay:
      type: loguniform
      low: 0.000001
      high: 0.005
