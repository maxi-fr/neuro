# Small causal waveform CNN example for the standard NN-predictor entry point.
simulation:
  dt: 0.0001
  downsample: 100
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  architecture: cnn
  n_y: 5
  n_u: 5
  hidden_size: 16
  depth: 2
  kernel_size: 3
  activation: tanh
  residual: true

training:
  fit: gradient_descent
  train_split: 0.8
  eval_horizon_s: 0.2
  epochs: 20
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  patience: 5
  scaler: robust
  global_scaling: true
  device: cpu
  seed: 1903
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 0
      curr_end: 10

artifact: "artifacts/example_waveform_cnn/model"
