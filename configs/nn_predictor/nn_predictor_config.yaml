# NN multi-step EEG predictor (scripts/run_nn_predictor_jax.py).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 50000
  data_path: data\experiment_excited\train

model:
  n_y: 14
  n_u: 13
  horizon: 20
  hidden_size: 64
  depth: 5
  projection:                # project the 62 EEG channels onto a fixed PCA latent space
    enable: false
    latent_dim: 16           # number of latent components k (takes precedence)
    explained_variance: null # used to auto-pick k when latent_dim is null (e.g. 0.95)

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.1
  train_split: 0.8
  curriculum_decay_fraction: 0.5
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
