# NN multi-step EEG predictor (scripts/run_nn_predictor_jax.py).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 50000
  data_path: results/simulation_2026-06-23_18-49-20/train

model:
  n_y: 10
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 6

training:
  epochs: 300
  batch_size: 528
  learning_rate: 0.001
  weight_decay: 0.1
  train_split: 0.8
  curriculum_decay_fraction: 0.5
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
