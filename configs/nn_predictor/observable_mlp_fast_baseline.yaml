simulation:
  dt: 0.0001
  downsample: 200          # fs = 50 Hz
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  n_y: 1
  n_u: 13                 # 5 - 1 + ceil(25 / 3) = 13: full smoothed-Frame control support
  hidden_size: 768
  depth: 1
  activation: tanh
  residual: true

observable:
  n_segment: 25           # 0.50 s Segment
  n_hop: 3                # 0.06 s Frame spacing
  band_hz: [1.0, 25.0]
  n_bin_pool: 1
  kernel: boxcar
  kernel_width: 5         # 0.30 s temporal pool

training:
  fit: gradient_descent
  train_split: 0.8
  eval_horizon_s: 1.5     # 25 Frames at the 16.67 Hz Frame rate
  epochs: 150
  batch_size: 256
  learning_rate: 0.000215
  weight_decay: 0.000063
  patience: 35
  scaler: standard
  device: auto
  seed: 69
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.5
      curr_start: 10
      curr_end: 80

artifact: "artifacts/cmp_observable_mlp_fast_baseline"
