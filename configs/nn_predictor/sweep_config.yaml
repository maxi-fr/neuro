simulation:
  n_steps: 2000
  downsample: 10
  dt: 0.0001
  data_path: "data/experiment_excited/train"

model:
  n_y: 5
  n_u: 5
  horizon: 5
  hidden_size: 128
  depth: 2

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  train_split: 0.8
  curriculum_decay_fraction: 0.8
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 50

sweep:
  n_trials: 50
  # artifact: "artifacts/sweep_nn_predictor_2026-06-28_... # point to an existing dir to restart interrupted sweep
  model:
    hidden_size:
      type: categorical
      choices: [64, 128, 256]
    depth:
      type: int
      low: 0
      high: 6
  training:
    learning_rate:
      type: loguniform
      low: 0.0001
      high: 0.01
    weight_decay:
      type: loguniform
      low: 0.00001
      high: 0.001
    batch_size:
      type: categorical
      choices: [64, 128, 256, 512]
    curriculum_decay_fraction:
      type: float
      low: 0.5
      high: 0.9
