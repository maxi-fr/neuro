simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_roast/train"

model:
  n_y: 15
  n_u: 10
  hidden_size: 64
  depth: 2               # nonlinear
  activation: softplus

training:
  epochs: 300
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  seed: 69
  patience: 100
  scaler: "robust"
  global_scaling: true
  eval_horizon_s: 1.0
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.0
      curr_start: 100
      curr_end: 250

artifact: "artifacts/nonlinear"
