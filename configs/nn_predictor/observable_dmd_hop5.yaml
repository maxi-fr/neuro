# Arm C of the predictor comparison: the Observable Predictor fitted in closed form by
# Hankel-DMDc, at the hop5 geometry every observable arm shares.
#
# Geometry rationale (n_hop=5, dt_frame=0.1s): the comparison holds the Control Horizon at 1.5s
# across all three arms, and only hops that divide 1.5s land on an integer number of steps.
# n_hop=10 is excluded arithmetically (1.5 / 0.2 = 7.5); n_hop=25 gives 3 steps and n_hop=15
# gives 5, so n_hop=5 is the one that reaches 1.5s with a decision rate (10 Hz, 15 steps)
# comparable to the waveform arm's.
#
# n_y and n_u are identical to the observable MLP arm (observable_mlp_hop5.yaml), so the only
# difference between arms B and C is the Trainer: backprop against closed-form SVD.
#
# dmd_energy/dmd_lambda are extrapolated from the hop25/hop15/hop10 sweeps, whose optima trend
# upward in energy as the hop shortens (0.921 -> 0.964 -> 0.990). The fit costs seconds, so
# prefer sweep_dmd_observable_hop5.yaml over this guessed point if there is time for it.
simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  n_y: 1
  n_u: 10  # StftGeometry(n_segment=50, n_hop=5, kernel_width=1).min_past_controls()
  depth: 0

observable:
  n_segment: 50
  n_hop: 5
  band_hz: null
  n_bin_pool: 1
  kernel: boxcar
  kernel_width: 1

training:
  fit: dmd
  train_split: 0.8
  eval_horizon_s: 1.5   # = the Control Horizon the arm is evaluated at
  dmd_energy: 0.99
  dmd_lambda: 0.002
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.5
      curr_start: 0
      curr_end: 1

artifact: "artifacts/cmp_observable_dmd_hop5"
