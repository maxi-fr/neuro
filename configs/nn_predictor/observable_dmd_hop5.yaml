# Arm C of the predictor comparison: the Observable Hankel-DMDc Predictor at n_hop=5.
#
# One step advances one Frame of 0.1 s, so the matched 1.5 s Control Horizon is 15 knots.
# n_u = 10 is forced by the control-support rule, ceil(n_segment / n_hop) = ceil(50 / 5).
#
# dmd_energy and dmd_lambda come from sweep_dmd_observable_hop5.yaml (30 trials, best
# val_log_mse 2.1017), not from the hop25/15/10 trend I first extrapolated them from.
# The comments below were stripped by the sweep's automated patch; the values are the swept ones.
simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: data/experiment_excited_long/train
model:
  n_y: 1
  n_u: 10
  depth: 0
observable:
  n_segment: 50
  n_hop: 5
  band_hz: null
  n_bin_pool: 1
  kernel: boxcar
  kernel_width: 1
training:
  fit: dmd
  train_split: 0.8
  eval_horizon_s: 1.5
  dmd_energy: 0.9987293041394881
  dmd_lambda: 1.0561385971447783e-06
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.5
      curr_start: 0
      curr_end: 1
artifact: artifacts/cmp_observable_dmd_hop5
