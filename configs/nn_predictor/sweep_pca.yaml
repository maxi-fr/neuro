simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"

model:
  horizon: 20

training:
  epochs: 250
  train_split: 0.8
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 50

sweep:
  n_trials: 50
  # artifact: "artifacts/sweep_nn_predictor_2026-06-28_... # point to an existing dir to restart interrupted sweep
  model:
    n_y:
      type: int
      low: 5
      high: 15
    n_u:
      type: int
      low: 5
      high: 15
    hidden_size:
      type: categorical
      choices: [64, 128, 256]
    depth:
      type: int
      low: 0
      high: 5
    latent_dim:              # k >= 62 (n EEG channels) trains on the raw channels (no projection)
      type: int
      low: 4
      high: 62
  training:
    learning_rate:
      type: loguniform
      low: 0.0001
      high: 0.01
    weight_decay:
      type: loguniform
      low: 0.0001
      high: 0.1
    batch_size:
      type: categorical
      choices: [64, 128, 256, 512]
    curriculum_end_epoch:      # epoch at which L reaches horizon (start epoch stays 0)
      type: int
      low: 150
      high: 250
    scaler:
      type: categorical
      choices: ["standard", "robust"]
    global_scaling:
      type: categorical
      choices: [true, false]
