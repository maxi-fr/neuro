# Observable-space predictor: forecast the log spectrogram on the frame grid instead of rolling
# the raw-EEG predictor 75 steps. At fs = 50 Hz with L = 50 / R = 25 the horizon holds M = 2 frames,
# so the recursion is 2 nodes on a state of order 10^1 rather than 75 nodes on 960.
# See docs/observable_prediction/spec.md.
simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_roast/train"

model:
  # Only n_y / n_u are read on this path: they define the history window the lift E maps from,
  # byte-identical to what MLPArtifact.prime produces.
  n_y: 15
  n_u: 10

training:
  epochs: 300
  warmup_epochs: 10
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.0005
  train_split: 0.8
  seed: 69
  patience: 100
  scaler: "robust"
  global_scaling: true
  eval_horizon_s: 1.5

observable:
  horizon: 75          # 1.5 s Control Horizon, the geometry mse02_psd_mpc_spectral.yaml deploys
  stft:
    n_segment: 50      # must equal the healthy envelope's L
    n_hop: 25          # must equal the healthy envelope's R
  z_dim: 32
  lift_hidden: 256
  lift_depth: 2
  transition_hidden: 128
  transition_depth: 2
  activation: softplus

artifact: "artifacts/observable_stft"
