simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"

model:
  n_y: 15
  n_u: 7
  horizon: 20
  hidden_size: 128       # Inherited from previous/default
  depth: 0
  latent_dim: null       # PCA latent components k; null or >= 62 (n EEG channels) disables it
  activation: softplus

training:
  epochs: 250
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.001
  train_split: 0.8
  curriculum_decay_fraction: 0.7  # Fixed typo from curriculum_delay_fraction
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 100
  scaler: "robust"       # Fixed typo from scalar
  global_scaling: true
