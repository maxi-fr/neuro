# Nonlinear (depth 1) NARX predictor on the manually-selected 25-channel EEG montage.
# Serves the selected-channel Nonlinear MPC closed-loop setup (MPCController).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null          # whole trajectory (20 s = 2000 downsampled steps). The old 500 kept only
                         # the first 5 s, i.e. almost none of the seizure the MPC has to suppress.
  data_path: "data/experiment_excited_reduced_channels/train"   # 25-channel selected montage

model:
  n_y: 15
  n_u: 10
  hidden_size: 128
  depth: 1               # nonlinear
  latent_dim: 20         # PCA-decorrelate the 25-channel montage (raw channels leave the tES->EEG response under-identified for the MLP)
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  seed: 69
  patience: 100
  scaler: "robust"
  global_scaling: true
  eval_horizon_s: 0.2
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 50
      curr_end: 200

artifact: "artifacts/meeting_seven_experiment/nonlinear_selected"
