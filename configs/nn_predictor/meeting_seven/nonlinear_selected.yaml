# Nonlinear (depth 1) NARX predictor on the manually-selected 25-channel EEG montage.
# Serves the selected-channel Nonlinear MPC closed-loop setup (MPCController).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited_reduced_channels/train"   # 25-channel selected montage

model:
  n_y: 15
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 1               # nonlinear
  latent_dim: 20         # PCA-decorrelate the 25-channel montage (raw channels leave the tES->EEG response under-identified for the MLP)
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  curriculum_start_epoch: 50
  curriculum_end_epoch: 200    # L ramps 1 -> horizon over [start, end] epochs, then holds at horizon
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 100
  scaler: "robust"
  global_scaling: true

artifact: "artifacts/meeting_seven_experiment/nonlinear_selected"
