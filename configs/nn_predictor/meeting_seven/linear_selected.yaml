# Linear (depth 0, affine) NARX predictor on the manually-selected 25-channel EEG montage.
# Serves the selected-channel Linear MPC closed-loop setup (LinearMPCController requires a
# depth-0 artifact).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited_reduced_channels/train"   # 25-channel selected montage

model:
  n_y: 15
  n_u: 7
  horizon: 20
  depth: 0               # linear (single affine layer) -> required by Linear* controllers
  latent_dim: null       # no PCA

training:
  epochs: 250
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.0        # no shrinkage: the tES->EEG gain is small and weight decay biases it toward zero
  train_split: 0.8
  curriculum_start_epoch: 50
  curriculum_end_epoch: 225    # L ramps 1 -> horizon over [start, end] epochs, then holds at horizon
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 100
  scaler: "robust"
  global_scaling: true

artifact: "artifacts/meeting_seven_experiment/linear_selected"
