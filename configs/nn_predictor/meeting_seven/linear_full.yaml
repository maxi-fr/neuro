# Linear (depth 0, affine) NARX predictor on the full 62-channel EEG.
# Serves both the full-EEG Linear MPC and Linear NARX MPC closed-loop setups
# (LinearMPCController / LinearNarxMPCController require a depth-0 artifact).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"   # full 62-channel EEG

model:
  n_y: 15
  n_u: 7
  horizon: 20
  depth: 0               # linear (single affine layer) -> required by Linear* controllers
  latent_dim: null       # no PCA

training:
  epochs: 250
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.001
  train_split: 0.8
  curriculum_decay_fraction: 0.7
  seed: 69
  w_psd: 0.0
  w_fc: 0.0
  patience: 100
  scaler: "robust"
  global_scaling: true

artifact: "artifacts/meeting_seven_experiment/linear_full"
