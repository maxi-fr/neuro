# Nonlinear (depth 1) NARX predictor on the full 62-channel EEG, projected onto a
# 20-dim PCA latent space. Serves the full-EEG PCA-reduced Nonlinear MPC setup
# (MPCController); the MPC runs in the latent space and decodes back to EEG for its cost.

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null          # whole trajectory (20 s = 2000 downsampled steps). The old 500 kept only
                         # the first 5 s, i.e. almost none of the seizure the MPC has to suppress.
  data_path: "data/experiment_excited/train"   # full 62-channel EEG

model:
  n_y: 15
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 1               # nonlinear
  latent_dim: 25         # PCA project 62 -> 25 latent dims
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  curriculum_start_epoch: 50
  curriculum_end_epoch: 200
  seed: 69
  w_psd: 0.0
  patience: 100
  scaler: "robust"
  global_scaling: true

artifact: "artifacts/meeting_seven_experiment/nonlinear_full_pca"
