# Nonlinear (depth 1) NARX predictor on the full 62-channel EEG.
# Serves the full-EEG Nonlinear NARX MPC closed-loop setup (NarxMPCController).

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null          # whole trajectory (20 s = 2000 downsampled steps). The old 500 kept only
                         # the first 5 s, i.e. almost none of the seizure the MPC has to suppress.
  data_path: "data/experiment_excited/train"   # full 62-channel EEG

model:
  n_y: 15
  n_u: 10
  hidden_size: 128
  depth: 1               # nonlinear
  latent_dim: null       # no PCA
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  seed: 69
  patience: 100
  scaler: "robust"
  global_scaling: true
  eval_horizon_s: 0.2
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 50
      curr_end: 200

artifact: "artifacts/meeting_seven_experiment/nonlinear_full"
