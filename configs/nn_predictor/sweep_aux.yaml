simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"

model:
  horizon: 20
  n_y: 15
  n_u: 10
  depth: 0

training:
  epochs: 250
  train_split: 0.8
  seed: 69
  patience: 50
  scaler: robust
  global_scaling: true
  batch_size: 256
  w_psd: 0.0
  w_fc: 0.0
  curriculum_end_epoch: 200

sweep:
  n_trials: 50
  training:
    learning_rate:
      type: loguniform
      low: 0.00001
      high: 0.001
    weight_decay:
      type: loguniform
      low: 0.00001
      high: 0.001
    curriculum_start_epoch:
      type: int
      low: 10
      high: 150
