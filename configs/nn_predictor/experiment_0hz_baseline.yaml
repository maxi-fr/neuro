# Baseline (Arm 1): Canonical 25-bin STFT (1.0 to 25.0 Hz, DC excluded).
simulation:
  dt: 0.0001
  downsample: 200
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  n_y: 1
  n_u: 10
  hidden_size: 512
  depth: 2
  activation: relu
  residual: true

observable:
  n_segment: 50
  n_hop: 5
  band_hz: [1.0, 25.0]
  n_bin_pool: 1
  kernel: boxcar
  kernel_width: 1

training:
  fit: gradient_descent
  train_split: 0.8
  eval_horizon_s: 1.5
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 25
  scaler: standard
  device: auto
  seed: 69
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 1.5
      curr_start: 5
      curr_end: 50

artifact: "artifacts/experiment_0hz/arm1_baseline"
