simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: 500           # downsampled steps per trajectory (50000 raw / 100 = 5 s)
  data_path: "data/experiment_excited/train"

model:
  n_y: 15
  n_u: 10
  horizon: 20
  hidden_size: 128
  depth: 1
  latent_dim: 16         # project onto 16 PCA components; the MPC runs in this reduced space
  activation: softplus

training:
  epochs: 250
  batch_size: 128
  learning_rate: 0.00001
  weight_decay: 0.0005
  train_split: 0.8
  curriculum_decay_fraction: 0.6
  seed: 69
  w_psd: 0.1             # PSD/FC losses now allowed with latent_dim: they are computed in EEG
  w_fc: 0.1              # space by decoding the latent rollout through the fixed inverse PCA
  patience: 100
  scaler: "robust"
  global_scaling: true
