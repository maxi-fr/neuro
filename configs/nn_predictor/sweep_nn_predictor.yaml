# Hyperparameter sweep on the corrected identification data (mixed-hold excitation, untruncated
# trajectories -- see docs/tes_field_geometry.md sec. 9.8). Ranked on validation NMSE.

simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null
  data_path: "data/experiment_excited/train"

model:
  horizon: 20
  activation: softplus

training:
  epochs: 250
  train_split: 0.8
  seed: 1903
  w_psd: 0.0
  w_fc: 0.0
  patience: 50
  scaler: "robust"
  global_scaling: true
  batch_size: 256
  curriculum_start_epoch: 100
  curriculum_end_epoch: 200

sweep:
  artifact: "artifacts/sweep_nn_predictor_2026-08-01_21-21-08"
  n_trials: 30
  model:
    n_y:
      type: int
      low: 10
      high: 20
    n_u:
      type: int
      low: 5
      high: 15
    hidden_size:
      type: categorical
      choices: [32, 64, 128, 256]
    depth:
      type: int
      low: 0
      high: 5
    # latent_dim:              # k >= 62 (n EEG channels) trains on the raw channels (no projection)
    #   type: int
    #   low: 4
    #   high: 62
  training:
    learning_rate:
      type: loguniform
      low: 0.00001
      high: 0.01
    weight_decay:
      type: loguniform
      low: 0.000001
      high: 0.001
