simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  activation: softplus
  n_y: 15
  n_u: 10

training:
  epochs: 250
  train_split: 0.8
  seed: 1903
  patience: 50
  scaler: "robust"
  global_scaling: true
  batch_size: 256
  eval_horizon_s: 0.2
  losses:
    curriculum_mse:
      weight: 1.0
      span_s: 0.2
      curr_start: 100
      curr_end: 200

sweep:
  artifact: "artifacts/sweep_nn_predictor_long"
  n_trials: 30
  model:
    hidden_size:
      type: categorical
      choices: [16, 32, 64, 128]
    depth:
      type: int
      low: 0
      high: 3
  training:
    learning_rate:
      type: loguniform
      low: 0.000005
      high: 0.0001
    weight_decay:
      type: loguniform
      low: 0.000001
      high: 0.005
