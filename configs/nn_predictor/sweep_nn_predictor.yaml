
simulation:
  dt: 0.0001
  downsample: 100        # effective dt = 1e-2 s
  n_steps: null
  data_path: "data/experiment_excited_long/train"

model:
  horizon: 20
  activation: softplus
  n_y: 15
  n_u: 10

training:
  epochs: 250
  train_split: 0.8
  seed: 1903
  w_psd: 0.0
  w_fc: 0.0
  patience: 50
  scaler: "robust"
  global_scaling: true
  batch_size: 256
  curriculum_start_epoch: 100
  curriculum_end_epoch: 200

sweep:
  artifact: "artifacts/sweep_nn_predictor_long"
  n_trials: 30
  model:
    hidden_size:
      type: categorical
      choices: [16, 32, 64, 128]
    depth:
      type: int
      low: 0
      high: 3
    # latent_dim:              # k >= 62 (n EEG channels) trains on the raw channels (no projection)
    #   type: int
    #   low: 4
    #   high: 62
  training:
    learning_rate:
      type: loguniform
      low: 0.000005
      high: 0.0001
    weight_decay:
      type: loguniform
      low: 0.000001
      high: 0.005
