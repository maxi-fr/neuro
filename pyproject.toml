[project]
name = "closed-loop-neurostimulation"
version = "0.1.0"
description = "Model Predictive Control for Neurostimulation"
authors = [
    {name = "Max Frankenberg", email = "frankenbergmax57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "neurolib>=0.6.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0", # Added for coverage reporting
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "ty",
    "validate-pyproject>=0.23",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "FIX",    # for comments like TODO, FIXME
    "TD",     # for structure of TODO comments
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "PGH003", # Use specific rule codes when ignoring type issues (simplified for ty)
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Single line implicit string concatenation (conflicts with formatter)
]

[tool.ruff.lint.isort]
# Ensures imports are grouped logically
known-first-party = ["closed-loop-neurostimulation"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"knowledge-base/**" = [
    "INP001", # Not a package — standalone scripts
]
"scripts/**" = [
    "INP001", # Not a package — standalone runnable demos
    "T201",   # print() is fine in CLI scripts
]
"tests/*" = [
    "S101",    # assert
    "PLR0913", # too-many-arguments
    "F401",    # unused import
    "ARG001",  # Unused function args (fixtures)
    "PLR2004", # Magic value used in comparison
    "D",       # Ignore docstrings in tests
    "INP001",  # No __init__.py in tests folder
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Usually, keeping the comma helps with cleaner diffs in git
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
# Added -v for more detail and --cov to integrate coverage
addopts = "-ra -q -v --cov=closed-loop-neurostimulation"
testpaths = ["tests"]

[tool.ty]

[tool.ty.rules]
# In ty, you control strictness by setting individual rules to "error", "warn", or "ignore".

# 1. Base Core Type Safety
invalid-assignment = "error"         # Assigning a value to a variable of an incompatible type
invalid-argument-type = "error"      # Passing an argument of an incompatible type to a function
invalid-return-type = "error"        # Returning a value that doesn't match the function's return annotation
unresolved-import = "error"          # Importing a module that cannot be found in the environment
unresolved-attribute = "error"       # Accessing an attribute that doesn't exist on that object type
unresolved-reference = "error"       # Using a variable or name that hasn't been defined

# 2. Quality of Life & Configuration Checks
possibly-missing-import = "error"    # Strict import resolution (analogous to mypy's missing import checks)
unused-ignore-comment = "warn"       # Flagging a '# ty: ignore' comment that is no longer needed
unused-type-ignore-comment = "warn"  # Flagging a standard '# type: ignore' that is no longer needed
ignore-comment-unknown-rule = "warn" # Flagging if you write an ignore for a rule that doesn't exist

# 3. Collection & Logic Boundaries
index-out-of-bounds = "error"        # Static bounds checking on indexable collections (e.g., tuples)
division-by-zero = "error"           # Catching literal division by zero statically
not-iterable = "error"               # Trying to use a non-iterable object in a 'for' loop or comprehension
not-subscriptable = "error"          # Trying to index an object that doesn't support it (like an integer)
