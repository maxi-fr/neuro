# Healthy / resting-state regime of the whole-brain Jansen-Rit plant.
#
# Standard TVB JansenRit parameters with weak inter-region coupling and a small
# amount of integrator noise produce a realistic ~10 Hz alpha rhythm with low
# network synchronization. This is the "good EEG" baseline the pathological
# regimes (jansen_rit_epileptic.yaml, jansen_rit_pd.yaml) are contrasted against.
#
# Schema matches jansen_rit_baseline.yaml so this config runs both through the
# `simulate` orchestrator (scripts/run_simulation.py) and the open-loop regime
# runner (scripts/run_regime.py, which reads only the `dynamics` block + t_end).

t_end: 4000.0  # total simulated time [ms] (long enough for a clean spectrum)

dynamics:
  class_path: neuro.jansen_rit_plant.TVBJansenRitDynamics
  dt: 0.1
  nsig: 0.02            # additive integrator noise -> non-repetitive, realistic EEG
  seed: 0
  coupling_strength: 0.1  # weak long-range coupling -> low synchronization
  model_params:
    A: [3.25]            # standard excitatory gain
    B: [22.0]            # standard inhibitory gain
    a: [0.1]
    b: [0.05]
    v0: [5.52]
    nu_max: [0.0025]
    r: [0.56]
    J: [135.0]
    a_1: [1.0]
    a_2: [0.8]
    a_3: [0.25]
    a_4: [0.25]
    mu: [0.22]           # baseline mean input -> alpha-band oscillation

output:
  class_path: neuro.jansen_rit_plant.TVBJansenRitOutput
  dt: 0.1
  n_nodes: 76

reference:
  class_path: simulate.reference.StepReference
  dt: 0.1
  step_value: 0.0

sensor:
  class_path: neuro.sensing.DirectSensor
  dt: 0.1
  n_sensors: 65
  std_dev: 0.0

estimator:
  class_path: simulate.estimator.IdentityEstimator
  dt: 0.1

controller:
  class_path: neuro.control.ZeroController
  dt: 0.1
