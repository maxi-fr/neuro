# Orchestrated UKF run: a reduced 4-node Jansen-Rit network (the leading regions of the TVB
# connectome) at an elevated excitatory gain, with the UKFEstimator tracking the hidden states
# and estimating the per-region bifurcation gain A and the per-region mean input online from the
# 62-channel EEG. The plant runs open loop (ZeroController); the UKF consumes the sensor's EEG.
t_end: 0.5

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  K: 0.75
  seed: 42
  speed: 50.0
  n_nodes: 4
  params:
    A: 3.4

reference: {class_path: simulate.reference.StepReference, dt: 0.0001, step_value: 0.0}

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement: {class_path: neuro.measurement.EEGMeasurement, speed: 50.0, n_nodes: 4}

estimator:
  class_path: neuro.estimator.UKFEstimator
  dt: 0.0001
  speed: 50.0
  n_nodes: 4
  estimate_a: true       # learn the per-region bifurcation gain A
  estimate_input: true   # learn the per-region mean input
  q_x5: 0.001
  q_a: 0.0000001
  p_a: 0.01
  q_input: 0.01
  p_input: 1.0
  r_channel: 0.01
  p_state: 0.01
  initial_K: 0.75
  q_K: 0.0               # fix K at the plant value
  p_K: 0.000000000001

controller: {class_path: neuro.control.ZeroController, dt: 0.0001, n_u: 1}
