# Grid specification for the network 2-D state-space map
# (scripts/run_state_map.py): a Chouzouris-style sweep over the background input
# mu and the global coupling strength sigma, classifying the 76-node network by
# synchronization, dominant frequency, and oscillation amplitude.
#
# NOTE: one full 76-node TVB simulation runs per grid cell, so cost scales with
# mu.num * sigma.num * duration_ms. Start coarse and refine.

dt: 0.1
duration_ms: 1500.0
transient_ms: 700.0
nsig: 0.0              # deterministic for clean state classification

mu:
  start: 0.05
  stop: 0.4
  num: 12

sigma:
  start: 0.0
  stop: 30.0
  num: 12
