# Whole-brain simulation with a 2-node Jansen-Rit network and UKF Estimator.
# All times in SI seconds.
t_end: 0.5

dynamics:
  class_path: neuro.jansen_rit.JansenRitDynamics
  dt: 0.0001
  K: 0.75
  seed: 42
  speed: 50.0
  n_nodes: 2
  params:
    A: 3.25

reference:
  class_path: simulate.reference.StepReference
  dt: 0.0001
  step_value: 0.0

sensors:
  class_path: simulate.sensor.GaussianSensor
  dt: 0.0001
  std_dev: 0.0
  measurement:
    class_path: neuro.measurement.EEGMeasurement
    speed: 50.0
    n_nodes: 2

estimator:
  class_path: neuro.estimator.UKFEstimator
  dt: 0.0001
  speed: 50.0
  n_nodes: 2
  q_x5: 0.001
  q_K: 0.00001
  q_w: 0.00001
  r_channel: 0.01
  p_state: 0.01
  p_K: 0.01
  p_w: 0.01
  initial_K: 0.5

controller:
  class_path: neuro.control.ZeroController
  dt: 0.0001
  n_u: 1
