# Pure-JAX reduced Jansen-Rit system identification (scripts/run_sysid_jax.py).
# Offline, uncontrolled fit: PCA-reduce the 76-node plant to N modes, then explore
# global knobs and refine A / w_weights against the EEG statistics.

dt: 1.0e-4            # full-plant integration step (s)
downsample: 10        # -> effective reduced-model dt = 1e-3 (resolves the ~10 Hz rhythm)
n_steps: 20000         # reduced-model steps to fit (after downsampling); 50000*10 = all 500k raw (~50 s)
window: 300           # truncated-backprop window (tames chaotic gradients)
burn_in: 2000         # samples dropped before stats: skips the model's x0 -> limit-cycle transient (~2 s)
n_components: 10      # N reduced virtual modes

# One or more same-regime recordings (different noise seeds). Their LFP is concatenated
# for the PCA basis and their PSD/FC statistics are averaged into a single fit target.
sims:
  - results/simulation_2026-06-23_08-18-38/log.npz
  #- results/simulation_2026-06-23_09-11-14/log.npz

free_params: [w_weights, eeg_gain]
a_init: [3.25, 3.25, 3.25, 3.25, 3.4, 3.6, 3.25, 3.25, 3.25, 3.25]
mean_input: 150.0
K: 1.0
w_init_scale: 5.0
w_max: 8.0

# Statistics loss (amplitude-sensitive magnitude PSD + spatial FC).
# time=0: the deterministic model cannot match any single noise seed's phase, and the
# average of random-phase recordings washes out -- only the PSD/FC stats are meaningful.
band: [0.0, 40.0]
nperseg: 512
spec_mode: magnitude
weights: {spec: 1.0, spatial: 0.0, time: 0.0}

# Exploration grid over the global knobs, then gradient refinement.
# A is barely identifiable by gradient (flat/multimodal PSD-vs-A), so it is localised here
# by exploration; the grid is the Cartesian product a_grid x k_grid x input_grid.
# explore:
  # a_grid: [3.25, 3.4, 3.6]
  # k_grid: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  # input_grid: [120.0, 150.0, 180.0, 220.0]
refine:
  steps: 1000
  lr: {"name": "cosine_decay", "init_value": 0.02, "decay_steps": 1000, "alpha": 0.001}
  clip: 1.0

out: results/sysid_jax_result.npz
